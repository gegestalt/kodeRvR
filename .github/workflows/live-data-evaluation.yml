name: Live external data evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 3"

permissions:
  contents: read

jobs:
  bounded-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -m live_data --live-data-limit 3
